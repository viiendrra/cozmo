<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Cozmo</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;color:#fff;font-family:Roboto,'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none}
#face{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}
.card{position:absolute;left:14px;right:14px;bottom:10%;height:132px;box-sizing:border-box;border-radius:28px;background:#141416;border:1px solid #2a2a2e;box-shadow:0 6px 24px #000c;padding:10px 14px;opacity:0;transform:translateX(40px);pointer-events:none;transition:opacity .25s,transform .25s}
.card.on{opacity:1;transform:none;pointer-events:auto}
#clockCard{text-align:center;display:flex;flex-direction:column;justify-content:center}
#bigclk{font-size:64px;font-weight:300;letter-spacing:2px;line-height:1.1}
#date{font-size:14px;color:#aaa;margin-top:2px}
#playCard{display:grid;grid-template-columns:64px 1fr 28px;grid-template-rows:auto auto auto;column-gap:10px;row-gap:2px;align-content:center}
#top{display:contents}
#art{grid-column:1;grid-row:1/4;align-self:center;width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#3b3b42,#222225);display:flex;align-items:center;justify-content:center;font-size:28px;color:#ffe566}
#info{grid-column:2;grid-row:1;min-width:0}
#ttl{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{font-size:12px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
#add{grid-column:3;grid-row:1;align-self:start;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:none;color:#fff;font-size:20px;line-height:20px;padding:0}
#prog{grid-column:2/4;grid-row:2;margin:2px 0 0}
#seek{-webkit-appearance:none;-moz-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(to right,#fff 0%,#555 0%);outline:none;margin:4px 0}
#seek::-moz-range-track{background:transparent;height:4px}
#seek::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:#fff}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
#times{display:flex;justify-content:space-between;font-size:11px;color:#aaa}
#ctl{grid-column:2/4;grid-row:3;display:flex;justify-content:space-between;align-items:center}
.b{background:none;border:none;color:#fff;width:34px;height:34px;border-radius:50%;padding:0;font-size:17px;display:flex;align-items:center;justify-content:center}
.b svg{fill:#fff;width:20px;height:20px}
.b.dim{opacity:.45}
#play{width:40px;height:40px;background:#fff}
#play svg{fill:#000;width:22px;height:22px}
#list{position:absolute;left:14px;right:14px;top:52px;bottom:auto;max-height:26%;z-index:20;overflow-y:auto;border-radius:22px;background:#141416;border:1px solid #2a2a2e;display:none}
#list.on{display:block}
#list div{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid #26262a;font-size:14px}
#list .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .x{flex:none;color:#888;padding:2px 6px}
#list .x.arm{color:#ff5a5a}
#list div.cur{color:#ffe566}
#list p{padding:14px;margin:0;font-size:13px;color:#aaa}
#modeCard,#eyeCard{display:flex;flex-direction:column;justify-content:center;gap:6px}
#mrow,.mrow2{display:flex;gap:8px}
.mb{flex:1;height:34px;background:#1d1d21;border:1px solid #2a2a2e;border-radius:14px;color:#fff;padding:0 4px;font-size:13px;font-weight:600}
.mb.on{border-color:#ffe566;color:#ffe566}
.lbl{font-size:11px;color:#aaa}
#cats{display:none;flex-wrap:wrap;gap:6px}
#cats button{background:#1d1d21;border:1px solid #2a2a2e;border-radius:14px;color:#fff;padding:4px 10px;font-size:12px}
#cats button.on{border-color:#ffe566;color:#ffe566}
#mhint{font-size:11px;color:#aaa;text-align:center}
#menubtn{position:absolute;top:8px;left:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;opacity:.35;z-index:30}
#menu{position:absolute;top:52px;left:10px;width:260px;box-sizing:border-box;padding:12px;border-radius:20px;background:#141416;border:1px solid #2a2a2e;box-shadow:0 6px 24px #000c;z-index:40;display:none;flex-direction:column;gap:6px}
#menu.on{display:flex}
#menu .mb{height:32px;font-size:12px}
#lockbtn{flex:none;width:100%;margin-top:4px;touch-action:none;transition:background 1s linear,color 1s linear}
#lockbtn.hold{background:#ffe566;color:#000}
#textCard{display:flex;flex-direction:column;justify-content:center;gap:6px}
#txt{width:100%;box-sizing:border-box;height:34px;border-radius:14px;border:1px solid #2a2a2e;background:#1d1d21;color:#fff;padding:0 12px;font-size:16px;-webkit-user-select:text;user-select:text;outline:none}
#menubtn svg,#lockov svg{fill:#ffe566}
#lockov{position:fixed;top:0;left:0;right:0;bottom:0;display:none;z-index:50;touch-action:none}
#lockov.on{display:block}
#lockov svg{position:absolute;top:18px;left:18px;opacity:.3;pointer-events:none}
#err{position:absolute;top:0;left:0;right:0;color:#f66;font-size:11px;background:#000a;z-index:9;pointer-events:none}#err:empty{display:none}
#ver{position:absolute;top:4px;right:8px;font-size:10px;opacity:.3}
#list .go{flex:none;padding:2px 6px;color:#aaa;font-size:12px}
#list .n{flex:none;color:#888;font-size:12px}
#list .ft{justify-content:space-between}
#list .mb{flex:none;height:30px;padding:0 12px;font-size:12px}
</style>
</head>
<body>
<canvas id="face"></canvas>
<div id="ver">v16</div>
<div id="err"></div>

<div class="card" id="clockCard"><div id="bigclk">--:--</div><div id="date"></div></div>

<div class="card" id="modeCard">
  <div id="mrow"><button class="mb" data-m="semua">Semua</button><button class="mb" data-m="kunci">Gantungan</button><button class="mb" data-m="jenis">Pilih jenis</button></div>
  <div id="cats"></div>
  <div id="mhint"></div>
</div>

<div class="card" id="textCard">
  <div class="lbl">Teks berjalan (menggantikan wajah)</div>
  <input id="txt" type="text" maxlength="120" placeholder="Ketik teks di sini">
  <div class="mrow2"><button class="mb" data-o="portrait">Portrait</button><button class="mb" data-o="landscape">Landscape</button><button class="mb" id="txtgo">Tampilkan</button></div>
</div>

<div id="list"></div>
<div class="card" id="playCard">
  <div id="top">
    <div id="art">♪</div>
    <div id="info"><div id="ttl">Belum ada lagu</div><div id="sub">Ketuk + untuk menambah</div></div>
    <button id="add">+</button>
  </div>
  <div id="prog"><input id="seek" type="range" min="0" max="1000" value="0"><div id="times"><span id="tc">0:00</span><span id="tr">-0:00</span></div></div>
  <div id="ctl">
    <button class="b dim" id="shuf">⇄</button>
    <button class="b" id="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
    <button class="b" id="play"></button>
    <button class="b" id="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg></button>
    <button class="b dim" id="rep">↻</button>
  </div>
</div>

<div id="menubtn"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg></div>
<div id="menu">
  <div class="lbl">Bentuk mata</div>
  <div class="mrow2"><button class="mb" data-e="oval">Lonjong</button><button class="mb" data-e="rect">Persegi</button></div>
  <div class="lbl">Seberapa sering ganti ekspresi</div>
  <div class="mrow2"><button class="mb" data-a="tenang">Tenang</button><button class="mb" data-a="normal">Normal</button><button class="mb" data-a="aktif">Aktif</button></div>
  <div class="lbl">Reaksi guncang, miring &amp; ketuk</div>
  <div class="mrow2"><button class="mb" data-r="1">Hidup</button><button class="mb" data-r="0">Mati</button></div>
  <button class="mb" id="lockbtn">Kunci layar (tahan 1 detik)</button>
</div>
<div id="lockov"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></svg></div>
<input id="file" type="file" multiple hidden>
<input id="dir" type="file" webkitdirectory multiple hidden>
<audio id="au" preload="auto"></audio>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
window.onerror=function(m,s,l){$('err').textContent='ERR: '+m+' @'+l};
/* pesan error hilang sendiri setelah 3 detik */
var errT=0;try{new MutationObserver(function(){clearTimeout(errT);if($('err').textContent)errT=setTimeout(function(){$('err').textContent=''},3000)}).observe($('err'),{childList:true,characterData:true,subtree:true})}catch(e){}
var cv=$('face'),ctx=cv.getContext('2d'),au=$('au'),W=0,H=0,U=300,Y='#ffe566';
function resize(){var r=Math.min(window.devicePixelRatio||1,1.5);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0)}
addEventListener('resize',resize);resize();setTimeout(resize,300);
var PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
$('play').innerHTML=PLAY;

/* ---------- state ---------- */
var m='normal',t0=Date.now(),pm='',pT0=0,holdUntil=0,moodNext='',moodNextMs=0,autoAt=0,aLast='';
var taps=[],shakes=[],dizzyAt=[],lastShake=0,flipT=0,held=false,holdT=0,tiltX=0,tiltY=0,reactOn=true,page=0,locked=false,hiddenAt=0,lockT=0;
var amode='kunci',acats={},ES='oval',alevel='normal',songStyle='',lastSp='',spH=[],textOn=false,txtStr='',txtO='portrait',txKey='',txW=0,menuOpen=false,MUS=['music','music listen','music dance','music bop','karaoke'];
var playing=false,waiting=false;
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function sel(k){pm=m;pT0=t0;m=k;t0=Date.now();var mm=MUS.indexOf(pm)>=0&&MUS.indexOf(k)>=0;TRd=mm?650:280;TRr=mm?700:320;TRe=mm?550:220;LR=mm?.08:.22;if(MUS.indexOf(k)<0){var nn=t0;nts.forEach(function(n){if(!n.k)n.k=nn})}}
function setMood(k,ms,nx,nms){aLast='r';sel(k);holdUntil=Date.now()+ms;moodNext=nx||'';moodNextMs=nms||0;autoAt=holdUntil+300}

/* ---------- audio ---------- */
var AC=null,an=null,fd=null,srcDone=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,v){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain();
  o.frequency.value=f;o.type='square';g.gain.value=v||.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
function hookAnalyser(){
  if(srcDone)return;var a=ac();if(!a)return;
  try{var s=a.createMediaElementSource(au);an=a.createAnalyser();an.fftSize=256;s.connect(an);an.connect(a.destination);fd=new Uint8Array(an.frequencyBinCount);srcDone=true}catch(e){an=null}
}

/* ---------- pemutar ---------- */
var list=[],cur=-1,shuf=false,rep=0,seeking=false,scope='*',viewPl=null,NOREL='__norel__';
function nm(f){return f.name.replace(/\.[^.]+$/,'')}
function parse(f){var n=nm(f),i=n.indexOf(' - ');return i>0?{a:n.slice(0,i),t:n.slice(i+3)}:{a:'Lokal',t:n}}
function ft(s){if(!isFinite(s)||s<0)return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
/* ---------- penyimpanan lagu di browser (IndexedDB): tetap ada setelah restart & offline ---------- */
var DB=null;
function dbOpen(cb){try{var r=indexedDB.open('cozmo-music',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('songs',{keyPath:'id',autoIncrement:true})};
  r.onsuccess=function(){DB=r.result;cb()};r.onerror=function(){$('err').textContent='Penyimpanan lagu tidak bisa dibuka'}}
  catch(e){$('err').textContent='Penyimpanan lagu tidak tersedia: '+e.message}}
function dbAll(cb){var out=[];DB.transaction('songs').objectStore('songs').openCursor().onsuccess=function(e){var c=e.target.result;if(c){out.push(c.value);c.continue()}else cb(out)}}
function dbAdd(f,pl,cb){var d1=0;function fin(a,b){if(!d1){d1=1;cb(a,b)}}
  try{var tx=DB.transaction('songs','readwrite'),rq=tx.objectStore('songs').add({name:f.name,size:f.size,pl:pl,blob:f,added:Date.now()});
    rq.onsuccess=function(){fin(rq.result)};tx.onabort=tx.onerror=function(){fin(null,(tx.error&&tx.error.name)||'error')}}catch(e){fin(null,e.message)}}
function dbDel(id,cb){try{var tx=DB.transaction('songs','readwrite');tx.objectStore('songs').delete(id);tx.oncomplete=cb}catch(e){$('err').textContent='Hapus gagal: '+e.message}}
function plNames(){var o=[],seen={};list.forEach(function(f){var p=f.pl||'Lainnya';if(!seen[p]){seen[p]=1;o.push(p)}});return o}
function plCount(p){var n=0;list.forEach(function(f){if(p==='*'||(f.pl||'Lainnya')===p)n++});return n}
function qList(){var q=[];for(var i=0;i<list.length;i++)if(scope==='*'||(list[i].pl||'Lainnya')===scope)q.push(i);return q}
function saveScope(){try{localStorage.setItem('cozmoScope',scope)}catch(e){}}
function stopAll(){au.pause();au.removeAttribute('src');au.load();cur=-1;playing=false;waiting=false;$('play').innerHTML=PLAY;$('ttl').textContent='Belum ada lagu';$('sub').textContent='Ketuk + untuk menambah'}
function delSong(i){var it=list[i];dbDel(it.id,function(){
  list.splice(i,1);
  if(i===cur)stopAll();else if(i<cur)cur--;
  if(scope!=='*'&&!plCount(scope)){scope='*';saveScope()}
  if(viewPl&&viewPl!=='*'&&!plCount(viewPl))viewPl=null;
  renderList();prog()})}
function delPl(p){var ids=list.filter(function(f){return(f.pl||'Lainnya')===p}).map(function(f){return f.id}),curId=cur>=0?list[cur].id:-1,n=0;
  (function nx(){if(n>=ids.length){list=list.filter(function(f){return ids.indexOf(f.id)<0});
    if(curId>=0&&ids.indexOf(curId)>=0)stopAll();else if(curId>=0)cur=list.map(function(f){return f.id}).indexOf(curId);
    if(scope===p){scope='*';saveScope()}viewPl=null;renderList();prog();return}
    dbDel(ids[n++],nx)})()}
function playScope(p){scope=p;saveScope();var q=qList();if(!q.length)return;load(shuf?q[Math.floor(Math.random()*q.length)]:q[0],true);$('list').classList.remove('on')}
function sp(txt,cls,fn){var e=document.createElement('span');e.className=cls;e.textContent=txt;if(fn)e.onclick=function(ev){ev.stopPropagation();fn(e)};return e}
function row(L,text,right,cls,fn){var d=document.createElement('div'),t=document.createElement('span');t.className='t';t.textContent=text;d.appendChild(t);if(cls)d.className=cls;d.onclick=fn;if(right)d.appendChild(right);L.appendChild(d)}
function arm(e,t1,t2,go){if(!e.arm){e.arm=1;e.className='x arm';e.textContent=t2;setTimeout(function(){e.arm=0;e.className='x';e.textContent=t1},3000)}else go()}
function foot(L){var d=document.createElement('div'),b=document.createElement('button'),tot=0;d.className='ft';b.className='mb';b.textContent='＋ Folder';
  b.onclick=function(ev){ev.stopPropagation();$('dir').click()};list.forEach(function(f){tot+=f.size||0});
  d.appendChild(b);d.appendChild(sp(list.length+' lagu · '+(tot/1048576).toFixed(0)+' MB','n'));L.appendChild(d)}
function renderList(){
  var L=$('list');L.innerHTML='';
  if(!list.length){var e=document.createElement('p');e.textContent='Belum ada lagu. Ketuk + untuk memilih lagu dan memberi nama playlist, atau ＋ Folder. Lagu disimpan di browser: tetap ada setelah restart dan bisa diputar tanpa internet.';L.appendChild(e);foot(L);return}
  if(viewPl===null){
    row(L,'Semua lagu',sp(plCount('*')+' ›','go',function(){viewPl='*';renderList()}),scope==='*'?'cur':'',function(){playScope('*')});
    plNames().forEach(function(p){row(L,p,sp(plCount(p)+' ›','go',function(){viewPl=p;renderList()}),scope===p?'cur':'',function(){playScope(p)})})}
  else{
    row(L,'‹ '+(viewPl==='*'?'Semua lagu':viewPl),viewPl==='*'?null:sp('Hapus playlist','x',function(e){arm(e,'Hapus playlist','Yakin?',function(){delPl(viewPl)})}),'',function(){viewPl=null;renderList()});
    var k=0;
    list.forEach(function(f,i){if(viewPl!=='*'&&(f.pl||'Lainnya')!==viewPl)return;k++;
      row(L,k+'. '+nm(f),sp('✕','x',function(e){arm(e,'✕','Hapus?',function(){delSong(i)})}),i===cur?'cur':'',function(){scope=viewPl;saveScope();load(i,true);L.classList.remove('on')})})}
  foot(L)}
function importFiles(fs){
  fs=fs.filter(function(f){return /^audio\//.test(f.type)||/\.(mp3|m4a|aac|ogg|opus|wav|flac|wma)$/i.test(f.name)});
  if(!fs.length||!DB){$('err').textContent='Tidak ada file audio yang dipilih';return}
  var g={},pr=false;
  fs.forEach(function(f){var rp=f.webkitRelativePath||'',p=NOREL;if(rp){var pt=rp.split('/');p=pt.length>1?pt[pt.length-2]:'Lainnya'}else pr=true;(g[p]=g[p]||[]).push(f)});
  if(pr){var nm0=prompt('Masukkan lagu ke playlist apa? (kosongkan = Lainnya)',scope==='*'?'Lainnya':scope);if(nm0===null)return;nm0=(nm0||'').trim()||'Lainnya';
    g[nm0]=(g[nm0]||[]).concat(g[NOREL]);delete g[NOREL]}
  var jobs=[];Object.keys(g).forEach(function(p){g[p].sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})}).forEach(function(f){jobs.push([p,f])})});
  var n=0,first=-1,firstPl='';
  (function nx(){
    if(n>=jobs.length){renderList();if(first>=0&&(cur<0||au.paused)){scope=firstPl;saveScope();load(first,true)}else prog();return}
    var j=jobs[n++];$('sub').textContent='Menyimpan '+n+'/'+jobs.length+'…';
    dbAdd(j[1],j[0],function(id,err){if(!err){list.push({id:id,name:j[1].name,size:j[1].size,pl:j[0],blob:j[1]});if(first<0){first=list.length-1;firstPl=j[0]}}else $('err').textContent='Gagal simpan: '+err;nx()})})();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(x){}
}
function load(i,go){
  if(!list.length)return;cur=(i+list.length)%list.length;songStyle='';autoAt=0;ivs=[];try{localStorage.setItem('cozmoLast',list[cur].id)}catch(e){}
  if(au.dataset.u)URL.revokeObjectURL(au.dataset.u);
  var u=URL.createObjectURL(list[cur].blob);au.dataset.u=u;au.src=u;
  var p=parse(list[cur]);$('ttl').textContent=p.t;$('sub').textContent=p.a+(scope!=='*'?' · '+scope:'');renderList();msMeta();
  if(go)play();
}
function play(){if(!au.getAttribute('src'))return;hookAnalyser();ac();var p=au.play();if(p&&p.catch)p.catch(function(e){$('err').textContent='Play: '+e.message})}
function nextIdx(dir){dir=dir||1;var q=qList();if(!q.length)return cur;
  if(shuf&&dir>0&&q.length>1){var n;do{n=q[Math.floor(Math.random()*q.length)]}while(n===cur);return n}
  var p=q.indexOf(cur);if(p<0)return q[dir>0?0:q.length-1];return q[(p+dir+q.length)%q.length]}
$('add').onclick=function(){$('file').click()};
$('art').onclick=function(){viewPl=null;renderList();$('list').classList.toggle('on')};
$('file').onchange=function(e){var fs=[].slice.call(e.target.files);e.target.value='';importFiles(fs)};
$('dir').onchange=function(e){var fs=[].slice.call(e.target.files);e.target.value='';importFiles(fs)};
$('play').onclick=function(){if(cur<0){$('file').click();return}if(au.paused)play();else au.pause()};
$('next').onclick=function(){if(list.length)load(nextIdx(),true)};
$('prev').onclick=function(){if(au.currentTime>3)au.currentTime=0;else if(list.length)load(nextIdx(-1),true)};
$('shuf').onclick=function(){shuf=!shuf;this.className='b'+(shuf?'':' dim')};
$('rep').onclick=function(){rep=(rep+1)%3;this.className='b'+(rep?'':' dim');this.textContent=rep===2?'↻1':'↻'};
/* ---------- kontrol headset / layar kunci HP (Media Session): ganti lagu, play/pause ---------- */
function msMeta(){
