<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Cozmo Face</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#start{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#00e5ff;font:600 22px sans-serif;text-align:center}
#start small{color:#7a8a95;font:14px sans-serif;margin-top:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start"><div>Ketuk layar untuk membangunkan robot</div><small>Gunakan mode landscape</small></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,started=false,ac=null,wl=null;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();

/* ---- Emosi: warna, skala mata, kelopak atas (lt), miring (sl), kelopak bawah (lb) ---- */
const EMO={
 idle:{c:[0,229,255],hs:1,ws:1,lt:0,sl:0,lb:0},
 happy:{c:[0,229,255],hs:.85,ws:1,lt:0,sl:0,lb:.55},
 angry:{c:[255,40,40],hs:.85,ws:1.05,lt:.2,sl:.55,lb:0},
 surprised:{c:[0,229,255],hs:1.2,ws:.85,lt:0,sl:0,lb:0},
 sleepy:{c:[0,180,210],hs:.9,ws:1,lt:.5,sl:0,lb:0},
 sleep:{c:[0,110,130],hs:.9,ws:1,lt:.93,sl:0,lb:0}
};
let cur=JSON.parse(JSON.stringify(EMO.idle)),tgt=EMO.idle,emo='idle',emoUntil=0;
let look={x:0,y:0},tilt=0,glance=0,nextGlance=0,blinkT=0,nextBlink=3000,blink=1;
let lastAct=performance.now();

function set(n,ms){emo=n;tgt=EMO[n];emoUntil=ms?performance.now()+ms:0}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function beep(f,d,t){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.1))}
const SFX={
 happy:()=>{beep(700,.08);setTimeout(()=>beep(950,.1),90)},
 angry:()=>beep(140,.3,'sawtooth'),
 surprised:()=>beep(1200,.12)
};
function react(n,ms,v){set(n,ms);if(SFX[n])SFX[n]();if(v)vib(v)}
function activity(){lastAct=performance.now();if(emo==='sleep'||emo==='sleepy')react('surprised',900)}

/* ---- Sensor gerak: kemiringan, guncangan, dibalik ---- */
let lg=null,shakes=[],flipped=false;
function onMotion(e){
 const g=e.accelerationIncludingGravity;if(!g||g.x==null)return;
 const a=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
 let sx,sy;
 if(a===90){sx=-g.y;sy=g.x}else if(a===270||a===-90){sx=g.y;sy=-g.x}else if(a===180){sx=-g.x;sy=-g.y}else{sx=g.x;sy=g.y}
 tilt=Math.max(-1,Math.min(1,-sx/6));
 const now=performance.now();
 if(lg){
  const d=Math.abs(g.x-lg.x)+Math.abs(g.y-lg.y)+Math.abs(g.z-lg.z);
  if(d>25&&(!shakes.length||now-shakes[shakes.length-1]>250)){
   shakes.push(now);shakes=shakes.filter(t=>now-t<2000);lastAct=now;
   if(shakes.length>=3){react('angry',3000,[200,100,200,100,300]);shakes=[]}
   else if(emo!=='angry')react('surprised',1200,[80]);
  }
 }
 lg={x:g.x,y:g.y,z:g.z};
 if(sy<-6&&!flipped){flipped=true;lastAct=now;react('angry',2500,[250,100,250])}
 else if(sy>-3)flipped=false;
}

/* ---- Sentuhan ---- */
let taps=[];
addEventListener('pointerdown',()=>{
 if(!started)return;
 const now=performance.now();taps.push(now);taps=taps.filter(t=>now-t<2000);lastAct=now;
 if(emo==='sleep'||emo==='sleepy'){react('surprised',900);return}
 if(taps.length>=4){react('angry',2500,[200,100,200]);taps=[]}
 else react('happy',1500,[30]);
});

document.getElementById('start').addEventListener('click',()=>{if(!started)start()});
/* ---- Mulai: layar penuh, wake lock, audio, sensor ---- */
async function start(){
 started=true;
 document.getElementById('start').remove();
 try{await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(e){}
 try{await screen.orientation.lock('landscape')}catch(e){}
 try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
 getLock();
 if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission){try{await DeviceMotionEvent.requestPermission()}catch(e){}}
 addEventListener('devicemotion',onMotion);
 react('happy',1200);
}
async function getLock(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&started)getLock()});

/* ---- Gambar ---- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function lerp(a,b,k){return a+(b-a)*k}

function update(t){
 for(const k of['hs','ws','lt','sl','lb'])cur[k]=lerp(cur[k],tgt[k],.2);
 for(let i=0;i<3;i++)cur.c[i]=lerp(cur.c[i],tgt.c[i],.2);
 if(emoUntil&&t>emoUntil){set('idle');lastAct=t}
 if(emo==='idle'||emo==='sleepy'){
  const idle=t-lastAct;
  if(idle>60000)set('sleep');else if(idle>30000&&emo==='idle')set('sleepy');
 }
 if(t>nextGlance){glance=emo==='idle'?(Math.random()-.5)*.8:0;nextGlance=t+2500+Math.random()*3500}
 look.x=lerp(look.x,Math.max(-1,Math.min(1,tilt+glance)),.15);
 if(emo==='sleep'||emo==='sleepy'){blink=1}
 else{
  if(t>nextBlink){blinkT=t;nextBlink=t+2000+Math.random()*3500}
  const p=(t-blinkT)/160;blink=(p>=0&&p<1)?1-Math.sin(Math.PI*p):1;
 }
}

function draw(t){
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 const ew=Math.min(W*.22,H*.6)*cur.ws;
 const eh=Math.min(H*.5,W*.3)*cur.hs*Math.max(.05,blink);
 const gap=W*.1;
 const jit=emo==='angry'?(Math.random()-.5)*8:0;
 const cx=W/2+look.x*W*.1+jit,cy=H/2;
 ctx.fillStyle='rgb('+cur.c.map(Math.round).join(',')+')';
 for(let i=0;i<2;i++){
  const x=cx+(i?gap/2:-gap/2-ew),y=cy-eh/2,r=Math.min(ew,eh)*.25;
  rr(x,y,ew,eh,r);ctx.fill();
  if(cur.lt>.01||cur.sl>.01||cur.lb>.01){
   ctx.save();rr(x,y,ew,eh,r);ctx.clip();ctx.fillStyle='#000';
   const s=cur.sl/2*(i?-1:1),lc=cur.lt-s,rc=cur.lt+s;
   ctx.beginPath();ctx.moveTo(x-2,y-2);ctx.lineTo(x+ew+2,y-2);
   ctx.lineTo(x+ew+2,y+rc*eh);ctx.lineTo(x-2,y+lc*eh);ctx.closePath();ctx.fill();
   if(cur.lb>.01){
    const b=cur.lb;
    ctx.beginPath();ctx.moveTo(x-2,y+eh+2);ctx.lineTo(x-2,y+eh*(1-b*.5));
    ctx.quadraticCurveTo(x+ew/2,y+eh*(1-b*1.6),x+ew+2,y+eh*(1-b*.5));
    ctx.lineTo(x+ew+2,y+eh+2);ctx.closePath();ctx.fill();
   }
   ctx.restore();
   ctx.fillStyle='rgb('+cur.c.map(Math.round).join(',')+')';
  }
 }
 if(emo==='sleep'){
  ctx.fillStyle='#4aa';ctx.font='bold '+Math.round(H*.1)+'px sans-serif';
  const o=(t/40)%60;ctx.fillText('z',W*.78,H*.3-o*.3);ctx.fillText('Z',W*.84,H*.2-o*.3);
 }
}

let last=0;
function frame(t){requestAnimationFrame(frame);if(t-last<33)return;last=t;if(started){update(t);draw(t)}}
requestAnimationFrame(frame);

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
