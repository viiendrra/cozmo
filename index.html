<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Cozmo</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;color:#fff;font-family:Roboto,'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none}
#face{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}
.card{position:absolute;left:14px;right:14px;bottom:36px;height:236px;box-sizing:border-box;border-radius:28px;background:#141416;border:1px solid #2a2a2e;box-shadow:0 6px 24px #000c;padding:14px 16px;opacity:0;transform:translateX(40px);pointer-events:none;transition:opacity .25s,transform .25s}
.card.on{opacity:1;transform:none;pointer-events:auto}
#clockCard{text-align:center;display:flex;flex-direction:column;justify-content:center}
#playCard{display:flex;flex-direction:column;justify-content:space-between}
#bigclk{font-size:64px;font-weight:300;letter-spacing:2px;line-height:1.1}
#date{font-size:14px;color:#aaa;margin-top:2px}
#top{display:flex;gap:12px;align-items:center}
#art{width:72px;height:72px;border-radius:14px;background:linear-gradient(135deg,#3b3b42,#222225);display:flex;align-items:center;justify-content:center;font-size:32px;color:#ffe566;flex:none}
#info{flex:1;min-width:0}
#ttl{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{font-size:12px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
#add{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:none;color:#fff;font-size:20px;line-height:20px;padding:0}
#prog{margin:12px 0 2px}
#seek{-webkit-appearance:none;-moz-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(to right,#fff 0%,#555 0%);outline:none;margin:6px 0}
#seek::-moz-range-track{background:transparent;height:4px}
#seek::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:#fff}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
#times{display:flex;justify-content:space-between;font-size:11px;color:#aaa}
#ctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.b{background:none;border:none;color:#fff;width:46px;height:46px;border-radius:50%;padding:0;font-size:20px;display:flex;align-items:center;justify-content:center}
.b svg{fill:#fff}
.b.dim{opacity:.45}
#play{width:56px;height:56px;background:#fff}
#play svg{fill:#000;width:28px;height:28px}
#list{position:absolute;left:14px;right:14px;bottom:282px;max-height:28%;overflow-y:auto;border-radius:22px;background:#141416;border:1px solid #2a2a2e;display:none}
#list.on{display:block}
#list div{padding:12px 16px;border-bottom:1px solid #26262a;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list div.cur{color:#ffe566}
#list p{padding:14px;margin:0;font-size:13px;color:#aaa}
#dots{position:absolute;left:0;right:0;bottom:8px;text-align:center;height:22px}
#dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#444;margin:7px 4px 0}
#dots i.on{background:#ffe566}
#err{position:absolute;top:0;left:0;right:0;color:#f66;font-size:11px;background:#000a;z-index:9}
#ver{position:absolute;top:4px;right:6px;font-size:10px;opacity:.3}
#modeCard{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.mb{background:#1d1d21;border:1px solid #2a2a2e;border-radius:18px;color:#fff;padding:14px 8px;font-size:15px;font-weight:600;text-align:center}
.mb small{display:block;font-weight:400;font-size:11px;color:#aaa;margin-top:3px}
.mb.on{border-color:#ffe566;color:#ffe566}
#lockbtn{position:absolute;top:8px;left:8px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;opacity:.35;z-index:30;touch-action:none;transition:transform 1s linear,opacity 1s linear}
#lockbtn svg,#lockov svg{fill:#ffe566}
#lockbtn.hold{transform:scale(1.5);opacity:1}
#lockov{position:fixed;top:0;left:0;right:0;bottom:0;display:none;z-index:50;touch-action:none}
#lockov.on{display:block}
#lockov svg{position:absolute;top:18px;left:18px;opacity:.3;pointer-events:none}
/* v9: kartu kompak seukuran jam, posisi agak tengah, tanpa titik penanda */
.card{height:132px;bottom:16%;padding:10px 14px}
#dots{display:none}
#list{bottom:calc(16% + 144px);max-height:24%}
.mb{padding:4px;font-size:14px;border-radius:14px}
.mb small{font-size:10px;margin-top:2px}
#playCard{display:grid;grid-template-columns:64px 1fr 28px;grid-template-rows:auto auto auto;column-gap:10px;row-gap:2px;align-content:center}
#top{display:contents}
#art{grid-column:1;grid-row:1/4;align-self:center;width:64px;height:64px;font-size:28px}
#info{grid-column:2;grid-row:1}
#add{grid-column:3;grid-row:1;align-self:start}
#ttl{font-size:15px}
#prog{grid-column:2/4;grid-row:2;margin:2px 0 0}
#seek{margin:4px 0}
#ctl{grid-column:2/4;grid-row:3;margin-top:0}
.b{width:34px;height:34px;font-size:17px}
.b svg{width:20px;height:20px}
#play{width:40px;height:40px}
#play svg{width:22px;height:22px}
</style>
</head>
<body>
<canvas id="face"></canvas>
<div id="ver">v9</div>
<div id="err"></div>

<div class="card" id="clockCard"><div id="bigclk">--:--</div><div id="date"></div></div>

<div class="card" id="modeCard">
<button class="mb" data-m="parkir">Parkir<small>Semua reaksi aktif</small></button>
<button class="mb" data-m="jalan">Jalan<small>Ramah, sentuhan dikunci</small></button>
<button class="mb" data-m="santai">Santai<small>Pelan dan mengantuk</small></button>
<button class="mb" data-m="malam">Malam<small>Redup, cepat tidur</small></button>
</div>
<div id="list"></div>
<div class="card" id="playCard">
  <div id="top">
    <div id="art">♪</div>
    <div id="info"><div id="ttl">Belum ada lagu</div><div id="sub">Ketuk ＋ untuk menambah</div></div>
    <button id="add">+</button>
  </div>
  <div id="prog"><input id="seek" type="range" min="0" max="1000" value="0"><div id="times"><span id="tc">0:00</span><span id="tr">-0:00</span></div></div>
  <div id="ctl">
    <button class="b dim" id="shuf">⇄</button>
    <button class="b" id="prev"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
    <button class="b" id="play"></button>
    <button class="b" id="next"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg></button>
    <button class="b dim" id="rep">↻</button>
  </div>
</div>
<div id="dots"><i class="on"></i><i></i><i></i><i></i></div>

<div id="lockbtn"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></svg></div>
<div id="lockov"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></svg></div>
<input id="file" type="file" accept="audio/*" multiple hidden>
<audio id="au" preload="auto"></audio>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
window.onerror=function(m,s,l){$('err').textContent='ERR: '+m+' @'+l};
var cv=$('face'),ctx=cv.getContext('2d'),au=$('au'),W=0,H=0,U=300,Y='#ffe566';
function resize(){W=cv.width=cv.clientWidth;H=cv.height=cv.clientHeight}
addEventListener('resize',resize);resize();setTimeout(resize,300);

var PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
$('play').innerHTML=PLAY;

/* ---------- state ---------- */
var mood='normal',moodUntil=0,lastAct=Date.now(),taps=[],shakes=[],page=0,lowBat=false;
var lx=0,ly=0,tx=0,ty=0,tiltX=0,tiltY=0,nextLook=0,nextBlink=2000,blinkT=-1,flipT=0,lastShake=0;
var energy=0,beat=false,beatPulse=0,playing=false,waiting=false,lastF=0,prevM='',fy=.46;
var nextAmb=0,ambUntil=0,ambMood='walk',swDir=1,lastTick=0,swing=0,swx=0,nts=[],lastNote=0;
var mode='parkir',moodNext='',moodNextMs=0,dizzyAt=[],held=false,holdT=0,locked=false,hiddenAt=0,lockT=0;
var MC={
 parkir:{list:['walk','play'],gap:[8000,8000],boring:25000,sleepy:60000,sleep:90000,react:1,dim:1},
 jalan:{list:['walk','wave','love','wink','walk'],gap:[5000,4000],boring:1e9,sleepy:1e9,sleep:1e9,react:0,dim:1},
 santai:{list:['yawn','walk'],gap:[9000,9000],boring:12000,sleepy:25000,sleep:50000,react:1,dim:1},
 malam:{list:['walk'],gap:[15000,15000],boring:1e9,sleepy:10000,sleep:20000,react:1,dim:.45}
};
try{var sm=localStorage.getItem('cozmoMode');if(sm&&MC[sm])mode=sm}catch(e){}
function act(){lastAct=Date.now()}
function setMood(m,ms,nx,nms){mood=m;moodUntil=Date.now()+ms;moodNext=nx||'';moodNextMs=nms||0;act()}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
try{if(navigator.getBattery)navigator.getBattery().then(function(b){function u(){lowBat=b.level<=.15&&!b.charging}u();b.onlevelchange=b.onchargingchange=u}).catch(function(){})}catch(e){}

/* ---------- audio ---------- */
var AC=null,an=null,fd=null,srcDone=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,v){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain();
  o.frequency.value=f;o.type='square';g.gain.value=v||.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
function hookAnalyser(){
  if(srcDone)return;var a=ac();if(!a)return;
  try{var s=a.createMediaElementSource(au);an=a.createAnalyser();an.fftSize=256;s.connect(an);an.connect(a.destination);fd=new Uint8Array(an.frequencyBinCount);srcDone=true}catch(e){an=null}
}
var lastBeatAt=0;
function readEnergy(t,now){
  var e;beat=false;
  if(an&&fd&&playing){an.getByteFrequencyData(fd);var s=0;for(var i=1;i<8;i++)s+=fd[i];e=s/7/255}
  else e=playing?.35+.3*Math.abs(Math.sin(t/260)):0;
  var prev=energy;energy+=(e-energy)*.35;
  if(e-prev>.1&&now-lastBeatAt>250){beat=true;lastBeatAt=now;beatPulse=1}
  beatPulse*=.85;
}

/* ---------- pemutar ---------- */
var list=[],cur=-1,shuf=false,rep=0,seeking=false;
function nm(f){return f.name.replace(/\.[^.]+$/,'')}
function parse(f){var n=nm(f),i=n.indexOf(' - ');return i>0?{a:n.slice(0,i),t:n.slice(i+3)}:{a:'Lokal',t:n}}
function ft(s){if(!isFinite(s)||s<0)return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function renderList(){
  var L=$('list');L.innerHTML='';
  if(!list.length){L.innerHTML='<p>Daftar kosong. Ketuk + untuk memilih lagu dari HP.</p>';return}
  list.forEach(function(f,i){var d=document.createElement('div');d.textContent=(i+1)+'. '+nm(f);
    if(i===cur)d.className='cur';d.onclick=function(){load(i,true);L.classList.remove('on')};L.appendChild(d)});
}
function load(i,go){
  if(!list.length)return;cur=(i+list.length)%list.length;
  if(au.dataset.u)URL.revokeObjectURL(au.dataset.u);
  var u=URL.createObjectURL(list[cur]);au.dataset.u=u;au.src=u;
  var p=parse(list[cur]);$('ttl').textContent=p.t;$('sub').textContent=p.a;renderList();
  if(go)play();
}
function play(){hookAnalyser();ac();var p=au.play();if(p&&p.catch)p.catch(function(e){$('err').textContent='Play: '+e.message})}
function nextIdx(){if(shuf&&list.length>1){var n;do{n=Math.floor(Math.random()*list.length)}while(n===cur);return n}return cur+1}
$('add').onclick=function(){$('file').click()};
$('art').onclick=function(){renderList();$('list').classList.toggle('on')};
$('file').onchange=function(e){
  var fs=[].slice.call(e.target.files);if(!fs.length)return;
  var first=list.length;list=list.concat(fs);renderList();
  if(cur<0||au.paused)load(first,true);
  e.target.value='';
};
$('play').onclick=function(){if(cur<0){$('file').click();return}if(au.paused)play();else au.pause()};
$('next').onclick=function(){if(list.length)load(nextIdx(),true)};
$('prev').onclick=function(){if(au.currentTime>3)au.currentTime=0;else if(list.length)load(cur-1,true)};
$('shuf').onclick=function(){shuf=!shuf;this.className='b'+(shuf?'':' dim')};
$('rep').onclick=function(){rep=(rep+1)%3;this.className='b'+(rep?'':' dim');this.textContent=rep===2?'↻1':'↻'};
au.onplay=function(){playing=true;$('play').innerHTML=PAUSE;beep(880,.08);beep(1175,.1)};
au.onpause=function(){playing=false;$('play').innerHTML=PLAY};
au.onended=function(){
  if(rep===2){au.currentTime=0;play();return}
  if(!list.length||(!shuf&&cur===list.length-1&&rep===0)){playing=false;$('play').innerHTML=PLAY;setMood('sad',4000);return}
  load(nextIdx(),true)};
au.onerror=function(){playing=false;waiting=false;setMood('doubt',3000);beep(220,.3,.06)};
au.onloadstart=au.onwaiting=function(){waiting=true};
au.oncanplay=au.onplaying=function(){waiting=false};
function prog(){
  var d=au.duration,c=au.currentTime,p=d?c/d*100:0;
  if(!seeking)$('seek').value=p*10;
  $('seek').style.background='linear-gradient(to right,#fff '+p+'%,#555 '+p+'%)';
  $('tc').textContent=ft(c);$('tr').textContent='-'+ft(d-c)}
au.ontimeupdate=au.onloadedmetadata=prog;
$('seek').oninput=function(){seeking=true;$('seek').style.background='linear-gradient(to right,#fff '+this.value/10+'%,#555 '+this.value/10+'%)'};
$('seek').onchange=function(){if(au.duration)au.currentTime=this.value/1000*au.duration;seeking=false};

/* ---------- jam ---------- */
var HR=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],BL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function clk(){var d=new Date();$('bigclk').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  $('date').textContent=HR[d.getDay()]+', '+d.getDate()+' '+BL[d.getMonth()]+' '+d.getFullYear()}
clk();setInterval(clk,1000);

/* ---------- halaman: wajah / jam / player ---------- */
function setPage(n){
  page=Math.max(0,Math.min(3,n));
  $('clockCard').classList.toggle('on',page===1);$('playCard').classList.toggle('on',page===2);$('modeCard').classList.toggle('on',page===3);
  if(page!==2)$('list').classList.remove('on');
  var d=$('dots').children;for(var i=0;i<4;i++)d[i].className=i===page?'on':'';act()}
$('dots').onclick=function(){setPage(page>=3?0:page+1)};
function setMode(k,quiet){mode=k;try{localStorage.setItem('cozmoMode',k)}catch(e){}
  [].forEach.call(document.querySelectorAll('.mb'),function(b){b.className='mb'+(b.dataset.m===k?' on':'')});
  updVer();nextAmb=0;ambUntil=0;if(!quiet)setMood('happy',1200)}
[].forEach.call(document.querySelectorAll('.mb'),function(b){b.onclick=function(){setMode(b.dataset.m)}});
function updVer(){$('ver').textContent='v9 · '+mode+(locked?' · LOCK':'')}
function setLock(on){locked=on;$('lockov').classList.toggle('on',on);$('lockbtn').classList.remove('hold');updVer();if(on)setPage(0);setMood('happy',1000)}
['touchstart','touchmove','touchend','touchcancel','click','mousedown'].forEach(function(ev){$('lockov').addEventListener(ev,function(e){e.preventDefault();e.stopPropagation()},{passive:false})});
$('lockbtn').addEventListener('touchstart',function(){this.classList.add('hold');clearTimeout(lockT);lockT=setTimeout(function(){setLock(true)},1000)},{passive:true});
['touchend','touchcancel'].forEach(function(ev){$('lockbtn').addEventListener(ev,function(){clearTimeout(lockT);this.classList.remove('hold')},{passive:true})});
setMode(mode,true);
var sy=null,sx=0;
document.addEventListener('touchstart',function(e){sy=e.touches[0].clientY;sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){
  if(sy===null)return;var t=e.changedTouches[0],dy=t.clientY-sy,dx=t.clientX-sx;sy=null;
  var tg=e.target;if(tg.closest&&tg.closest('#list,#seek'))return;
  if(locked||Math.abs(dx)<55||Math.abs(dy)>Math.abs(dx))return;
  setPage(page+(dx<0?1:-1));
},{passive:true});

/* ---------- layar penuh, wake lock ---------- */
var wl=null;
function goFull(){
  var d=document.documentElement,f=d.requestFullscreen||d.mozRequestFullScreen||d.webkitRequestFullscreen;
  try{if(f&&!(document.fullscreenElement||document.mozFullScreenElement))f.call(d)}catch(e){}
  try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(function(){})}catch(e){}
  try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(function(l){wl=l;l.onrelease=function(){wl=null}}).catch(function(){})}catch(e){}
}
document.addEventListener('click',function(){goFull();ac();act()});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();return}
  if(locked&&hiddenAt&&Date.now()-hiddenAt>=2000)setLock(false);
  hiddenAt=0;goFull()});

/* ---------- sensor + ketuk ---------- */
addEventListener('deviceorientation',function(e){
  if(e.gamma==null)return;
  tiltX=Math.max(-1,Math.min(1,e.gamma/40));tiltY=Math.max(-1,Math.min(1,((e.beta||0)-75)/40));
});
addEventListener('devicemotion',function(e){
  var a=e.accelerationIncludingGravity;if(!a)return;var now=Date.now();
  if(!MC[mode].react)return;var mag=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
  if(Math.abs(mag-9.8)>13&&now-lastShake>250){
    lastShake=now;shakes.push(now);shakes=shakes.filter(function(t){return now-t<1600});
    if(shakes.length>=3){dizzyAt.push(now);dizzyAt=dizzyAt.filter(function(t){return now-t<9000});shakes=[];
      if(dizzyAt.length>=2){setMood('angry',3000,'sassy',2500);vib([200,100,200,100,300]);beep(200,.3,.08)}
      else{setMood('dizzy',3500);vib(120)}}
    else if(mood!=='dizzy'){setMood('surprised',900);beep(1400,.08)}
  }
  if(a.y<-7){if(!flipT)flipT=now;else if(now-flipT>600&&mood!=='angry'){setMood('angry',3000);vib([300,100,300]);beep(180,.4,.08)}}
  else flipT=0;
});
cv.addEventListener('click',function(){
  if(held){held=false;return}
  if(page>0){setPage(0);return}
  if(!MC[mode].react)return;
  var now=Date.now();taps.push(now);taps=taps.filter(function(t){return now-t<2000});
  if(taps.length>=4){setMood('angry',3500,'sassy',2500);if(taps.length===4)vib([150,80,150]);beep(200,.2,.08)}
  else if(taps.length===3){setMood('sassy',1800);beep(500,.1,.06)}
  else{setMood('happy',1500);beep(1000+taps.length*200,.08)}
});

cv.addEventListener('touchstart',function(){held=false;clearTimeout(holdT);holdT=setTimeout(function(){if(page===0&&MC[mode].react){held=true;setMood('love',3200);beep(1318,.1,.05);beep(1568,.14,.05)}},650)},{passive:true});
['touchend','touchmove','touchcancel'].forEach(function(ev){cv.addEventListener(ev,function(){clearTimeout(holdT)},{passive:true})});

/* ---------- ekspresi ---------- */
function M(o){var b={ew:1,eh:1,sb:1,a1:0,a2:0,b1:0,b2:0,mw:1,mc:.7,mo:0,mx:0,tilt:0,dy:0};for(var k in o)b[k]=o[k];return b}
var MOODS={
  normal:M({}),
  walk:M({mc:.8,mw:1.1}),
  play:M({mw:1.15,mc:.6,mo:.35,tilt:.1}),
  happy:M({ew:1.06,eh:1.06,mw:1.25,mc:.5,mo:.55}),
  sad:M({eh:.95,a1:.45,a2:.08,b1:.08,b2:.45,mw:.7,mc:-.5,dy:.04}),
  boring:M({ew:1.08,eh:.95,a1:.42,a2:.42,b1:.42,b2:.42,mw:.75,mc:0,dy:.01}),
  doubt:M({ew:1.05,sb:1.15,a1:.45,a2:.5,b1:.05,b2:.3,mw:.6,mc:.1,mx:.05,tilt:.05}),
  surprised:M({ew:1.2,eh:1.4,mw:1,mc:0,mo:1.4,dy:-.02}),
  angry:M({ew:1.05,eh:1.05,a1:.05,a2:.5,b1:.5,b2:.05,mw:.9,mc:-.4}),
  sleepy:M({ew:1.05,a1:.5,a2:.5,b1:.5,b2:.5,mw:.7,mc:.2,dy:.02}),
  sleep:M({mw:.6,mc:.2,dy:.03}),
  think:M({eh:1.05,sb:1.1,a1:.2,a2:.2,mw:.5,mc:0,tilt:.04}),
  love:M({mw:1.1,mc:.6,mo:.2}),
  wink:M({mw:1.2,mc:.7,mo:.3}),
  wave:M({mw:1.25,mc:.6,mo:.5,tilt:.05}),
  yawn:M({ew:1.05,eh:.7,a1:.35,a2:.35,b1:.35,b2:.35,mw:2.2,mo:1.4,dy:.02}),
  dizzy:M({mw:.8,mc:-.1}),
  sassy:M({a1:.35,a2:.45,b1:.45,b2:.35,mw:.7,mc:-.2,tilt:-.08})
};
var P=M({}),KEYS=['ew','eh','sb','a1','a2','b1','b2','mw','mc','mo','mx','tilt','dy'];

function eye(ex,ey,w,h,l1,l2){
  ctx.fillStyle=Y;ctx.beginPath();ctx.ellipse(ex,ey,w,h,0,0,6.2832);ctx.fill();
  if(l1>.01||l2>.01){
    var y1=ey-h+l1*2*h,y2=ey-h+l2*2*h;
    ctx.fillStyle='#000';ctx.beginPath();ctx.moveTo(ex-w-3,ey-h-8);ctx.lineTo(ex+w+3,ey-h-8);
    ctx.lineTo(ex+w+3,y2);ctx.lineTo(ex-w-3,y1);ctx.closePath();ctx.fill()}
}
function arcEye(ex,ey,r,dir){
  ctx.strokeStyle=Y;ctx.lineWidth=U*.035;ctx.lineCap='round';ctx.beginPath();
  if(dir>0)ctx.arc(ex,ey+r*.45,r,3.4,6.02);else ctx.arc(ex,ey-r*.45,r,.28,2.86);
  ctx.stroke()}
function mouth(x,y,w,c,o){
  ctx.fillStyle=Y;ctx.strokeStyle=Y;ctx.lineWidth=U*.022;ctx.lineCap='round';
  if(o>=1){ctx.beginPath();ctx.ellipse(x,y+w*.15,w*.28,w*.36,0,0,6.2832);ctx.fill();return}
  var d=c*U*.05;
  if(o>.04){var dd=d+o*U*.06;ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.lineTo(x+w/2,y);ctx.quadraticCurveTo(x,y+2*dd,x-w/2,y);ctx.fill()}
  else{ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.quadraticCurveTo(x,y+2*d,x+w/2,y);ctx.stroke()}
}
function note(x,y,s,dbl,al){
  ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);ctx.fillStyle=Y;ctx.strokeStyle=Y;ctx.lineWidth=s*.18;ctx.lineCap='round';
  ctx.beginPath();ctx.ellipse(0,0,s*.6,s*.45,-.4,0,6.2832);ctx.fill();
  ctx.beginPath();ctx.moveTo(s*.52,-s*.1);ctx.lineTo(s*.52,-s*2.2);
  if(dbl){ctx.moveTo(s*2.1,-s*.3);ctx.lineTo(s*2.1,-s*2.4);ctx.moveTo(s*.52,-s*2.2);ctx.lineTo(s*2.1,-s*2.4);ctx.stroke();
    ctx.beginPath();ctx.ellipse(s*1.6,-s*.2,s*.6,s*.45,-.4,0,6.2832);ctx.fill()}
  else{ctx.quadraticCurveTo(s*1.5,-s*1.9,s*1.1,-s*1.1);ctx.stroke()}
  ctx.restore()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function heart(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.6,y-s*.2,x-s*.8,y-s*1.3,x,y-s*.45);ctx.bezierCurveTo(x+s*.8,y-s*1.3,x+s*1.6,y-s*.2,x,y+s*.9);ctx.fill()}
function spiral(x,y,r,rot){ctx.strokeStyle=Y;ctx.lineWidth=U*.02;ctx.lineCap='round';ctx.beginPath();
  for(var a=0;a<=12.6;a+=.25){var rd=r*a/12.6,px=x+Math.cos(a+rot)*rd,py=y+Math.sin(a+rot)*rd;if(a)ctx.lineTo(px,py);else ctx.moveTo(px,py)}ctx.stroke()}
function hand(now){
  ctx.save();ctx.translate(U*.36,U*.34);ctx.rotate(Math.sin(now/120)*.45);ctx.fillStyle=Y;
  ctx.beginPath();ctx.ellipse(0,-U*.08,U*.06,U*.075,0,0,6.2832);ctx.fill();
  ctx.beginPath();ctx.ellipse(-U*.06,-U*.06,U*.025,U*.045,.6,0,6.2832);ctx.fill();
  ctx.fillRect(-U*.025,0,U*.05,U*.1);ctx.restore();
  ctx.font='bold '+Math.round(U*.07)+'px sans-serif';ctx.fillText('Hai!',-U*.42,-U*.2)}

/* ---------- frame ---------- */
function frame(t){
  requestAnimationFrame(frame);
  if(t-lastF<33)return;lastF=t;
  var now=Date.now();if(!W||!H)resize();
  U=Math.min(W,H*.6);
  if(playing)act();
  readEnergy(t,now);

  var idle=now-lastAct,C=MC[mode];if(moodNext&&now>moodUntil){mood=moodNext;moodUntil=now+moodNextMs;moodNext=''}
  if(now>nextAmb){nextAmb=now+C.gap[0]+Math.random()*C.gap[1];if(idle<C.boring&&!playing){ambMood=C.list[Math.floor(Math.random()*C.list.length)];ambUntil=now+(ambMood==='wave'?3600:3200)}}
  var m=mood;
  if(now>moodUntil){
    if(lowBat&&!playing)m='battery';
    else if(waiting&&cur>=0)m='think';
    else if(playing)m='music';
    else if(idle>C.sleep)m='sleep';
    else if(idle>C.sleepy)m='sleepy';
    else if(idle>C.boring)m='boring';
    else if(now<ambUntil)m=ambMood;
    else m='normal';
  }
  if(m!==prevM){cv.style.opacity=(m==='sleep'?.5:1)*C.dim;prevM=m}

  var key=m==='music'?'happy':(m==='battery'?'normal':m),T=MOODS[key]||MOODS.normal;
  for(var i=0;i<KEYS.length;i++){var k=KEYS[i];P[k]+=(T[k]-P[k])*.22}

  if(now>nextLook){tx=(Math.random()*2-1)*.5;ty=(Math.random()*2-1)*.3;nextLook=now+1500+Math.random()*2500}
  if(m==='walk')tx=Math.sin(now/650)*.9;else if(m==='sassy')tx=-.9;
  var ltx=m==='sleep'?0:tx*.5+tiltX,lty=m==='sleep'?0:ty*.5+tiltY*.5;
  lx+=(ltx-lx)*.15;ly+=(lty-ly)*.15;
  if(blinkT<0&&now>nextBlink)blinkT=now;
  var bl=1;
  if(blinkT>=0){var p=(now-blinkT)/200;if(p>=1){blinkT=-1;nextBlink=now+2000+Math.random()*3500}else bl=1-Math.sin(p*Math.PI)*.92}
  fy=.4;

  /* ayun mengikuti beat */
  var swT=0,swXt=0;
  if(m==='music'){
    if(beat||now-lastTick>700){swDir=-swDir;lastTick=now;
      if(nts.length<6)nts.push({x:W*(.1+Math.random()*.8),y:H*fy+U*(.2+Math.random()*.25),t:now,d:Math.random()<.4})}
    swT=swDir*(.07+energy*.12);swXt=swDir*U*.04}
  swing+=(swT-swing)*.22;swx+=(swXt-swx)*.22;

  var bob=m==='walk'?-Math.abs(Math.sin(now/230))*U*.02:0,
      bnc=m==='music'?-beatPulse*U*.025:0,
      wig=m==='play'?Math.sin(now/170)*.1:(m==='dizzy'?Math.sin(now/130)*.14:(m==='wave'?Math.sin(now/260)*.04:0));
  var cx=W/2+swx,cy=H*fy+P.dy*U+bob+bnc;

  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(P.tilt+swing+wig);

  if(m==='battery'){
    var bw=U*.46,bh=U*.23;ctx.strokeStyle=Y;ctx.lineWidth=U*.02;rr(-bw/2,-bh/2,bw,bh,U*.04);ctx.stroke();
    ctx.fillStyle=Y;rr(bw/2+U*.01,-bh*.18,U*.025,bh*.36,U*.01);ctx.fill();
    var n=1+(Math.floor(now/600)%2)*0;if(Math.floor(now/500)%2===0)for(var s=0;s<n;s++)ctx.fillRect(-bw/2+U*.03+s*U*.06,-bh/2+U*.03,U*.045,bh-U*.06)}
  else{
    var ox=lx*U*.05*((m==='walk'||m==='sassy')?3:1),oy=ly*U*.035,ex=U*.2,ew=U*.085*P.ew,eh=U*.1*P.eh;
    var arc=m==='sleep'?-1:(m==='music'&&Math.floor(now/8000)%2?1:0);
    if(m==='love'){ctx.fillStyle=Y;var hs=U*.09*(1+.12*Math.sin(now/150));heart(-ex+ox,oy,hs);heart(ex+ox,oy,hs)}
    else if(m==='dizzy'){var sr=now/90;spiral(-ex,0,ew*1.1,sr);spiral(ex,0,ew*1.1,-sr)}
    else if(m==='wink'){arcEye(-ex+ox,oy,ew*1.05,1);eye(ex+ox,oy,ew,eh*bl,0,0)}
    else if(arc){arcEye(-ex+ox,oy,ew*1.05,arc);arcEye(ex+ox,oy,ew*1.05,arc)}
    else{
      var hh=eh*bl,sb=P.sb;
      eye(-ex+ox,oy,ew,hh,P.a1,P.a2);
      eye(ex+ox,oy,ew*sb,hh*sb,P.b1,P.b2)}
    var mo=m==='music'?.25+energy*1.5:P.mo;if(mo>.95&&m==='music')mo=.95;
    mouth(P.mx*U+ox*.5,U*.17+oy*.5,U*.13*P.mw,P.mc,mo);
    if(m==='sleep'){ctx.fillStyle='#9bd';ctx.font='bold '+Math.round(U*.07)+'px sans-serif';
      for(var z=0;z<2;z++){var q=((t/1800)+z*.5)%1;ctx.globalAlpha=1-q;ctx.fillText('z',U*.25+q*U*.07,-U*.1-q*U*.22)}ctx.globalAlpha=1}
    if(m==='dizzy'){ctx.fillStyle=Y;for(var s3=0;s3<3;s3++){var ag=now/220+s3*2.09;ctx.beginPath();ctx.arc(Math.cos(ag)*U*.22,-U*.2+Math.sin(ag)*U*.04,U*.013,0,6.2832);ctx.fill()}}
    if(m==='wave')hand(now);
    if(m==='think'){var nd=1+Math.floor(t/350)%3;ctx.fillStyle=Y;for(var d=0;d<nd;d++){ctx.beginPath();ctx.arc(U*.2+d*U*.05,-U*.2,U*.014,0,6.2832);ctx.fill()}}
  }
  ctx.restore();

  /* not nada */
  if(m==='music'||(playing&&m==='happy')){
    for(var j=nts.length-1;j>=0;j--){var n2=nts[j],a=now-n2.t;
      if(a>3200){nts.splice(j,1);continue}
      note(n2.x+Math.sin(a/380)*U*.03,n2.y-a*.05*(U/300),U*.035,n2.d,1-a/3200)}
  }else nts.length=0;
}
requestAnimationFrame(frame);
renderList();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
