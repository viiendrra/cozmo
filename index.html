<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Cozmo</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#8ff;font-family:sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;position:relative}
#face{flex:1;width:100%;min-height:0;display:block}
#ui{padding:8px 14px 14px;background:#061214;border-top:1px solid #0a3a40}
#np{font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
#seek{width:100%;accent-color:#5ff;margin:0 0 6px}
#ctl{display:flex;justify-content:space-around;align-items:center}
button{background:#0b2a2e;color:#8ff;border:1px solid #0e5760;border-radius:50%;width:52px;height:52px;font-size:20px}
button#play{width:64px;height:64px;font-size:26px;background:#0e5760}
#list{position:absolute;left:0;right:0;bottom:0;height:55%;background:#031012f2;border-top:2px solid #0e5760;overflow-y:auto;display:none;z-index:5}
#list.on{display:block}
#list div{padding:14px;border-bottom:1px solid #0a3a40;font-size:15px}
#list div.cur{color:#fff;background:#0b2a2e}
#list p{padding:14px;opacity:.7;margin:0}
#err{position:absolute;top:0;left:0;right:0;color:#f66;font-size:11px;background:#000a;z-index:9}
#ver{position:absolute;top:4px;right:6px;font-size:10px;opacity:.4}
</style>
</head>
<body>
<div id="app">
  <canvas id="face"></canvas>
  <div id="ver">v4</div>
  <div id="err"></div>
  <div id="list"></div>
  <div id="ui">
    <div id="np">Belum ada lagu - ketuk ＋</div>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <div id="ctl">
      <button id="pl">☰</button>
      <button id="prev">⏮</button>
      <button id="play">▶</button>
      <button id="next">⏭</button>
      <button id="add">＋</button>
    </div>
  </div>
</div>
<input id="file" type="file" accept="audio/*" multiple hidden>
<audio id="au" preload="auto"></audio>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
window.onerror=function(m,s,l){$('err').textContent='ERR: '+m+' @'+l};
var cv=$('face'),ctx=cv.getContext('2d'),au=$('au'),W=0,H=0;
function resize(){var r=cv.getBoundingClientRect();W=cv.width=r.width|0;H=cv.height=r.height|0}
addEventListener('resize',resize);resize();setTimeout(resize,300);

/* ---------- state ---------- */
var mood='normal',moodUntil=0,lastAct=Date.now(),taps=[],shakes=[];
var lx=0,ly=0,tx=0,ty=0,tiltX=0,tiltY=0,hs=1,ws=1,nextLook=0,nextBlink=2000,blinkT=-1,flipT=0;
var energy=0,playing=false,beatPulse=0,animIdx=0,animSince=0;
function act(){lastAct=Date.now()}
function setMood(m,ms){mood=m;moodUntil=Date.now()+ms;act()}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ---------- audio: beep + analyser ---------- */
var AC=null,an=null,fd=null,srcDone=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,v){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain();
  o.frequency.value=f;o.type='square';g.gain.value=v||.05;o.connect(g);g.connect(a.destination);
  o.start();o.stop(a.currentTime+d)}
function hookAnalyser(){
  if(srcDone)return;var a=ac();if(!a)return;
  try{var s=a.createMediaElementSource(au);an=a.createAnalyser();an.fftSize=256;
    s.connect(an);an.connect(a.destination);fd=new Uint8Array(an.frequencyBinCount);srcDone=true}catch(e){an=null}
}
function readEnergy(t){
  var e=0;
  if(an&&fd){an.getByteFrequencyData(fd);var s=0;for(var i=1;i<8;i++)s+=fd[i];e=s/7/255}
  else e=.35+.35*Math.abs(Math.sin(t/260)); /* cadangan kalau analyser gagal */
  var prev=energy;energy+=(e-energy)*.35;
  if(e-prev>.12)beatPulse=1;
  beatPulse*=.88;
}

/* ---------- music player ---------- */
var list=[],cur=-1;
function name(f){return f.name.replace(/\.[^.]+$/,'')}
function renderList(){
  var L=$('list');L.innerHTML='';
  if(!list.length){L.innerHTML='<p>Daftar kosong. Ketuk ＋ untuk memilih lagu dari HP.</p>';return}
  list.forEach(function(f,i){var d=document.createElement('div');d.textContent=(i+1)+'. '+name(f);
    if(i===cur)d.className='cur';d.onclick=function(e){e.stopPropagation();load(i,true);L.classList.remove('on')};L.appendChild(d)});
}
function load(i,go){
  if(!list.length)return;cur=(i+list.length)%list.length;
  if(au.dataset.u)URL.revokeObjectURL(au.dataset.u);
  var u=URL.createObjectURL(list[cur]);au.dataset.u=u;au.src=u;
  $('np').textContent=name(list[cur]);animIdx=cur;renderList();
  if(go)play();
}
function play(){hookAnalyser();ac();var p=au.play();if(p&&p.catch)p.catch(function(e){$('err').textContent='Play: '+e.message})}
$('add').onclick=function(){$('file').click()};
$('file').onchange=function(e){
  var fs=[].slice.call(e.target.files);if(!fs.length)return;
  var first=list.length;list=list.concat(fs);renderList();
  if(cur<0||au.paused)load(first,true);
  e.target.value='';
};
$('play').onclick=function(){if(cur<0){$('add').onclick();return}if(au.paused)play();else au.pause()};
$('next').onclick=function(){load(cur+1,!au.paused||true)};
$('prev').onclick=function(){if(au.currentTime>3)au.currentTime=0;else load(cur-1,true)};
$('pl').onclick=function(){renderList();$('list').classList.toggle('on')};
au.onplay=function(){playing=true;$('play').textContent='⏸';beep(880,.08);beep(1175,.1)};
au.onpause=function(){playing=false;$('play').textContent='▶'};
au.onended=function(){if(list.length>1)load(cur+1,true);else{playing=false;$('play').textContent='▶'}};
au.ontimeupdate=function(){if(au.duration&&!seeking)$('seek').value=au.currentTime/au.duration*1000};
var seeking=false;$('seek').oninput=function(){seeking=true};
$('seek').onchange=function(){if(au.duration)au.currentTime=this.value/1000*au.duration;seeking=false};
['ui','list'].forEach(function(i){$(i).addEventListener('click',function(e){e.stopPropagation()})});

/* ---------- layar penuh, portrait, wake lock ---------- */
var wl=null;
function goFull(){
  var d=document.documentElement,f=d.requestFullscreen||d.mozRequestFullScreen||d.webkitRequestFullscreen;
  try{if(f&&!(document.fullscreenElement||document.mozFullScreenElement))f.call(d)}catch(e){}
  try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(function(){})}catch(e){}
  try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(function(l){wl=l;l.onrelease=function(){wl=null}}).catch(function(){})}catch(e){}
}
document.addEventListener('click',function(){goFull();ac();act()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)goFull()});

/* ---------- sensor ---------- */
addEventListener('deviceorientation',function(e){
  if(e.gamma==null)return;
  tiltX=Math.max(-1,Math.min(1,e.gamma/40));
  tiltY=Math.max(-1,Math.min(1,((e.beta||0)-75)/40));
});
var lastShake=0;
addEventListener('devicemotion',function(e){
  var a=e.accelerationIncludingGravity;if(!a)return;var now=Date.now();
  var mag=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
  if(Math.abs(mag-9.8)>13&&now-lastShake>250){
    lastShake=now;shakes.push(now);shakes=shakes.filter(function(t){return now-t<1600});
    if(shakes.length>=3){setMood('angry',3000);vib([200,100,200,100,300]);beep(200,.3,.08);shakes=[]}
    else{setMood('surprised',900);beep(1400,.08)}
  }
  if(a.y<-7){if(!flipT)flipT=now;else if(now-flipT>600&&mood!=='angry'){setMood('angry',3000);vib([300,100,300]);beep(180,.4,.08)}}
  else flipT=0;
});

/* ---------- tap ---------- */
cv.addEventListener('click',function(){
  var now=Date.now();taps.push(now);taps=taps.filter(function(t){return now-t<1500});
  if(taps.length>=4){setMood('angry',2500);vib([150,80,150]);beep(200,.25,.08);taps=[]}
  else{setMood('happy',1500);beep(1000+taps.length*200,.08)}
});

/* ---------- gambar ---------- */
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function eye(cx,cy,w,h,side,m,ox,oy){
  var x=cx-w/2+ox,y=cy-h/2+oy;
  ctx.fillStyle='#5ff';rr(x,y,w,h,w*.3);ctx.fill();
  ctx.fillStyle='#000';
  if(m==='happy'){ctx.beginPath();ctx.arc(cx+ox,y+h*1.02,w*.62,0,6.3);ctx.fill()}
  else if(m==='angry'){var ix=side<0?x+w+4:x-4,ox2=side<0?x-4:x+w+4;
    ctx.beginPath();ctx.moveTo(ox2,y-4);ctx.lineTo(ix,y-4);ctx.lineTo(ix,y+h*.5);ctx.closePath();ctx.fill()}
}

/* Animasi musik: tambah di sini. Tiap fungsi mengembalikan {dx,dy,sy,sx}.
   e = energi bass 0..1, b = denyut beat 0..1, t = waktu ms. */
var ANIMS=[
  function(e,b,t){return{dx:0,dy:-b*H*.05,sy:1+e*.25,sx:1-e*.08}},                         /* goyang naik-turun */
  function(e,b,t){return{dx:Math.sin(t/350)*W*.05,dy:-e*H*.03,sy:1+b*.2,sx:1}},            /* geleng kiri-kanan */
  function(e,b,t){return{dx:0,dy:Math.sin(t/180)*H*.015,sy:.9+b*.4,sx:1+b*.1}}             /* getar mengikuti beat */
];

function frame(t){
  requestAnimationFrame(frame);
  var now=Date.now();
  if(!W||!H)resize();
  if(playing)act();
  readEnergy(t);

  /* tentukan mood */
  var m=mood;
  if(now>moodUntil){
    var idle=now-lastAct;
    if(playing)m='happy';
    else if(idle>90000)m='sleep';
    else if(idle>60000)m='sleepy';
    else m='normal';
  }
  var th=1,tw=1;
  if(m==='happy'){th=.9}
  else if(m==='angry'){th=.85}
  else if(m==='surprised'){th=1.3;tw=1.1}
  else if(m==='sleepy'){th=.45}
  else if(m==='sleep'){th=.07}
  hs+=(th-hs)*.2;ws+=(tw-ws)*.2;

  /* lirik acak */
  if(now>nextLook){tx=(Math.random()*2-1)*.5;ty=(Math.random()*2-1)*.3;nextLook=now+1500+Math.random()*2500}
  var ltx=(m==='sleep')?0:tx*.5+tiltX,lty=(m==='sleep')?0:ty*.5+tiltY*.5;
  lx+=(ltx-lx)*.12;ly+=(lty-ly)*.12;

  /* kedip */
  if(blinkT<0&&now>nextBlink){blinkT=now}
  var bl=1;
  if(blinkT>=0){var p=(now-blinkT)/160;if(p>=1){blinkT=-1;nextBlink=now+2000+Math.random()*3500}else bl=1-Math.sin(p*Math.PI)*.93}

  /* animasi musik */
  var a={dx:0,dy:0,sy:1,sx:1};
  if(playing&&m==='happy'){
    if(now-animSince>9000){animSince=now;animIdx=(animIdx+1)%ANIMS.length}
    a=ANIMS[animIdx%ANIMS.length](energy,beatPulse,t);
  }

  /* gambar */
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  var ew=W*.27*ws*a.sx,eh=Math.min(W*.36,H*.42)*hs*bl*a.sy;
  var gap=W*.2,cy=H*.5+a.dy,ox=lx*W*.08+a.dx,oy=ly*H*.06;
  if(m==='happy'||m==='angry'){eh=Math.max(eh,Math.min(W*.36,H*.42)*.8*bl)}
  eye(W/2-gap,cy,ew,eh,-1,m,ox,oy);
  eye(W/2+gap,cy,ew,eh,1,m,ox,oy);
}
requestAnimationFrame(frame);
renderList();

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
